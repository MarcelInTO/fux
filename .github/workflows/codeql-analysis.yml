name: "CodeQL"

# Static analysis of the code fux actually ships: the Fux TUI and the reused XmlNotepad
# `Model` engine it links, which since the upstream tree was pruned is all the repository
# still carries.
#
# This replaces upstream's version of the file, which MSBuilt src/XmlNotepad.sln on
# windows-latest — analyzing the WinForms application, the installer projects,
# WindowsInput and XmlStats, none of which fux compiled — and triggered on a `master`
# branch that does not exist here, so its push and pull_request triggers had never once
# fired and only the weekly schedule ran. Scoped to `main`, matching ci.yml:
# `upstream-master` is a pristine mirror of microsoft/XmlNotepad with no fux project in it.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '40 14 * * 6'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # net10.0, required by Terminal.Gui v2 — the same SDK ci.yml builds with, so CodeQL
      # analyzes the assemblies that actually ship rather than a different build of them.
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.36.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # An explicit build between init and analyze rather than autobuild, so what gets
      # traced is exactly what ci.yml ships and not whatever autobuild decides to find.
      # Building Fux.csproj pulls in Model.csproj by project reference, so both are traced.
      # (Model's PreBuild writes the gitignored src/Model/ApiKey.cs — src/Directory.Build.targets
      # makes that cross-platform, so a clean checkout needs no stub injected here.)
      - name: Build the fux TUI and the Model engine
        run: dotnet build src/Fux/Fux.csproj -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.36.3
        with:
          category: "/language:${{ matrix.language }}"
