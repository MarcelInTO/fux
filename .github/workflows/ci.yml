name: fux CI

# Cross-platform build + headless smoke for the fux TUI and the reused XmlNotepad engine,
# and publish of a self-contained single-file binary per OS as a downloadable artifact.
# The TUI itself is exercised by the --drill self-test under a PTY on Linux/macOS; final
# visual checks per platform remain human.
#
# Scoped to `main` on purpose, not to every branch: `upstream-master` is a pristine mirror
# of microsoft/XmlNotepad, which has no fux project to build.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: build & smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Builds the reused Model engine (netstandard2.0) + the Fux TUI (net10.0,
      # required by Terminal.Gui v2).
      - name: Build engine + TUI (Release)
        run: dotnet build src/Fux/Fux.csproj -c Release

      # The contract a downloaded binary is judged by before anything else: asking it what
      # it is has to answer, and a mistyped option has to say so. Both used to fall through
      # to the editor, which without a TTY reads as a hang — hence timeout-minutes, so a
      # regression fails the step instead of parking the job. (GitHub's own step timeout,
      # not timeout(1): the macOS runners have no such command.)
      - name: CLI contract smoke (--help, --version, bad flag)
        timeout-minutes: 5
        shell: bash
        run: |
          out=$(dotnet run --project src/Fux -c Release -- --help < /dev/null)
          echo "$out"
          # Anchored to the usage rows themselves. A bare `grep -- --validate` also matches
          # the prose line below the list, so deleting the row it is meant to guard left the
          # check green — verified by removing it.
          echo "$out" | grep -q '^Usage:$'                     || { echo "::error::--help printed no usage"; exit 1; }
          for row in '<file> ' '--dump <file>' '--validate <file>' '--version' '--help'; do
            echo "$out" | grep -q "^  fux $row" || { echo "::error::--help omits the '$row' row"; exit 1; }
          done

          ver=$(dotnet run --project src/Fux -c Release -- --version < /dev/null)
          echo "$ver"
          echo "$ver" | grep -qE '^fux [0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::--version printed '$ver'"; exit 1; }

          set +e
          err=$(dotnet run --project src/Fux -c Release -- --nope < /dev/null 2>&1)
          code=$?
          set -e
          echo "$err"
          [ "$code" -eq 2 ] || { echo "::error::unknown option should exit 2 (got $code)"; exit 1; }
          echo "$err" | grep -q "unknown option" || { echo "::error::unknown option went unreported"; exit 1; }

      # --dump loads the file into the DOM and prints the tree; no TTY needed.
      - name: Headless render smoke (Fux --dump)
        shell: bash
        run: |
          out=$(dotnet run --project src/Fux -c Release -- --dump sandbox/testdata/emp.xml)
          echo "$out"
          echo "$out" | grep -q "<Employees>" || { echo "::error::--dump output missing <Employees>"; exit 1; }
          echo "$out" | grep -q "@id"          || { echo "::error::--dump output missing @id attribute"; exit 1; }

      # HTML import: .html routes through SgmlReader (XmlNotepad's FormMain.ImportHtml
      # parity), so tag-soup HTML — unclosed <meta>/<p>, void <br> — loads as a DOM
      # instead of failing XML well-formedness. Fixture is generated inline.
      - name: HTML import smoke (SgmlReader coercion)
        shell: bash
        run: |
          printf '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="utf-8">\n<title>busted</title>\n</head>\n<body><p>hello<br>world</body>\n</html>\n' > "$RUNNER_TEMP/busted.html"
          out=$(dotnet run --project src/Fux -c Release -- --dump "$RUNNER_TEMP/busted.html")
          echo "$out"
          echo "$out" | grep -q "<html>"           || { echo "::error::HTML import produced no <html> root"; exit 1; }
          echo "$out" | grep -q "@charset"         || { echo "::error::unclosed <meta> attribute missing"; exit 1; }
          echo "$out" | grep -q "<br>"             || { echo "::error::void <br> element missing"; exit 1; }

      # Exercises the XSD validation path end to end (auto-loads emp.xsd via schemaLocation).
      - name: Engine validation smoke (valid doc -> 0 errors)
        shell: bash
        run: |
          out=$(dotnet run --project sandbox/smoke -c Release -- sandbox/testdata/emp.xml)
          echo "$out"
          echo "$out" | grep -q "1 schema(s) associated" || { echo "::error::emp.xsd was not associated"; exit 1; }
          echo "$out" | grep -q "0 error(s)"              || { echo "::error::expected 0 validation errors on emp.xml"; exit 1; }

      # The error pane's data path, headless: --validate collects diagnostics and, for each,
      # prints the tree node an Enter-jump would land on (FindNodeAt + MapToTree).
      - name: Fux validation smoke (valid doc -> no issues)
        shell: bash
        run: |
          out=$(dotnet run --project src/Fux -c Release -- --validate sandbox/testdata/emp.xml)
          echo "$out"
          echo "$out" | grep -q "no issues" || { echo "::error::expected no issues on emp.xml"; exit 1; }

      - name: Fux validation smoke (invalid doc -> errors + node jump)
        shell: bash
        run: |
          set +e
          out=$(dotnet run --project src/Fux -c Release -- --validate sandbox/testdata/emp-invalid.xml)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 1 ] || { echo "::error::--validate should exit 1 on an invalid doc (got $code)"; exit 1; }
          echo "$out" | grep -q "MinInclusive constraint failed" || { echo "::error::missing expected Zip range error"; exit 1; }
          echo "$out" | grep -q -- "-> <Zip>"                    || { echo "::error::error row did not map to the <Zip> node"; exit 1; }

      # Drives the real TUI under a PTY: --drill builds the actual UI, injects key events
      # (F6 focus ring, Enter-to-jump, F9 menu, ^Q), and asserts against the driver's output
      # buffer — borders/titles render, every cell painted, only theme-palette backgrounds.
      # Windows is skipped: no script(1)/PTY equivalent on the runner.
      #
      # Run over one document of each kind fux can open. The drill is fixture-agnostic, and
      # the import paths differ from the XML one in ways only a real document exercises: a
      # JSON/CSV import has no whitespace of its own (so the writer must supply layout) and
      # is retargeted to a sibling .xml (so a save cannot overwrite the source).
      - name: TUI drill (headless interactive self-test)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          fail=0
          for f in sandbox/testdata/emp-invalid.xml sandbox/testdata/import.json sandbox/testdata/import.csv; do
            echo "::group::drill $f"
            set +e
            if [ "$RUNNER_OS" = "macOS" ]; then
              script -q /dev/null dotnet run --project src/Fux -c Release -- --drill "$f" > drill.out 2>&1
            else
              script -qec "dotnet run --project src/Fux -c Release -- --drill $f" /dev/null > drill.out 2>&1
            fi
            set -e
            sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g' drill.out | grep -aE '^\s*\[(ok|FAIL)\]|DRILL:' || true
            echo "::endgroup::"
            grep -aq "DRILL: PASS" drill.out || { echo "::error::TUI drill failed on $f"; fail=1; }
          done
          [ "$fail" -eq 0 ]

      # Self-contained single-file binary (bundles the .NET runtime; no install needed to run).
      - name: Publish single-file binary (${{ matrix.rid }})
        run: >
          dotnet publish src/Fux/Fux.csproj -c Release
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -o publish

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: fux-${{ matrix.rid }}
          path: |
            publish/fux
            publish/fux.exe
          if-no-files-found: ignore
