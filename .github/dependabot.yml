version: 2

# Upstream's version of this file listed seven nuget directories, five of which fux does
# not have — two of them (src/BuildTasks, src/WpfApp) never existed in this repository at
# all. fux builds exactly two projects, so those are what get watched.

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'          # means .github/workflows
    open-pull-requests-limit: 10
    schedule:
      interval: 'weekly'

  # The TUI: Terminal.Gui, Newtonsoft.Json, SgmlReader.
  - package-ecosystem: 'nuget'
    directory: 'src/Fux'
    open-pull-requests-limit: 10
    schedule:
      interval: 'weekly'

  # The reused XmlNotepad document engine.
  - package-ecosystem: 'nuget'
    directory: 'src/Model'
    open-pull-requests-limit: 10
    schedule:
      interval: 'weekly'
